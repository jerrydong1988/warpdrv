name: Windows MSI

on:
  push:
    branches: ['codex/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/desktop/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        run: npm ci

      - name: Validate translations
        run: npm run i18n:check -w @warpcore/app

      - name: Lint core packages
        run: npm run lint

      - name: Run core tests
        run: npm test -w @warpcore/realmcore

      - name: Run server tests
        run: npm test -w @warpcore/server

      - name: Run warpmcp tests
        run: npm test -w @warpcore/warpmcp

      - name: Run bridge tests
        run: npm test -w @warpcore/bridge

      - name: Build shared declarations
        run: npx tsc -b packages/shared packages/realmcore

      - name: Typecheck server
        run: npx tsc -p packages/server/tsconfig.json --noEmit

      - name: Typecheck app
        run: npx tsc -p packages/app/tsconfig.json --noEmit

      - name: Typecheck bridge
        run: npx tsc -p packages/bridge/tsconfig.json --noEmit

      - name: Typecheck warpmcp
        run: npx tsc -p packages/warpmcp/tsconfig.json --noEmit

      - name: Build frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npx vite build
        working-directory: packages/app

      - name: Build server binary
        shell: pwsh
        working-directory: packages/server
        run: node scripts/build.mjs win32 x64

      - name: Prepare Tauri sidecar
        shell: pwsh
        working-directory: packages/desktop
        run: |
          $targetTriple = (rustc --print host-tuple).Trim()
          New-Item -ItemType Directory -Force -Path binaries\node_modules | Out-Null
          Copy-Item ..\server\dist\warpcore-server.exe "binaries\warpcore-server-$targetTriple.exe"
          Copy-Item ..\server\dist\better_sqlite3.node binaries\
          Copy-Item -Recurse ..\server\dist\node_modules\* binaries\node_modules\
          Remove-Item -Recurse -Force app-dist -ErrorAction SilentlyContinue
          Copy-Item -Recurse ..\app\dist app-dist

      - name: Build MSI
        run: npx tauri build --bundles msi
        working-directory: packages/desktop

      - name: Upload MSI
        uses: actions/upload-artifact@v5
        with:
          name: warpdrv-windows-msi
          path: packages/desktop/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 7
