name: CI

on:
  push:
    branches: [master, feat/*]
  pull_request:
    branches: [master]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Type check shared
        run: npx tsc --noEmit -p packages/shared/tsconfig.json

      - name: Type check server
        run: npx tsc --noEmit -p packages/server/tsconfig.json

      - name: Type check app
        continue-on-error: true
        run: npx tsc --noEmit -p packages/app/tsconfig.json

  build:
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build -w @warpcore/app

  i18n-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Validate locale JSON files
        run: |
          echo "=== Validating en JSON ==="
          for f in packages/app/src/i18n/locales/en/*.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" && echo "  OK: $f" || echo "  FAIL: $f"
          done
          echo ""
          echo "=== Validating zh-CN JSON ==="
          for f in packages/app/src/i18n/locales/zh-CN/*.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" && echo "  OK: $f" || echo "  FAIL: $f"
          done

      - name: Verify zh-CN has all en keys
        run: |
          echo "=== Key coverage check ==="
          for ns in common settings chat onboarding home servers backends models hub mcp recipes checkpoints proxy about; do
            EN_COUNT=$(node -e "console.log(Object.keys(JSON.parse(require('fs').readFileSync('packages/app/src/i18n/locales/en/${ns}.json','utf8'))).length)")
            ZH_COUNT=$(node -e "console.log(Object.keys(JSON.parse(require('fs').readFileSync('packages/app/src/i18n/locales/zh-CN/${ns}.json','utf8'))).length)")
            if [ "$EN_COUNT" != "$ZH_COUNT" ]; then
              echo "  MISMATCH: $ns (en=$EN_COUNT, zh-CN=$ZH_COUNT)"
            else
              echo "  OK: $ns ($EN_COUNT keys each)"
            fi
          done
