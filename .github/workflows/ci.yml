name: CI

on:
  push:
    branches: [master, feat/*]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Type check shared (our changes)
        continue-on-error: true
        run: npx tsc --noEmit -p packages/shared/tsconfig.json --skipLibCheck 2>&1 | tail -10

      - name: Build app
        run: npx vite build
        working-directory: packages/app

  i18n-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Validate locale JSON files
        run: |
          echo "=== Validating en JSON ==="
          for f in packages/app/src/i18n/locales/en/*.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" && echo "  OK: $f" || echo "  FAIL: $f"
          done
          echo ""
          echo "=== Validating zh-CN JSON ==="
          for f in packages/app/src/i18n/locales/zh-CN/*.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" && echo "  OK: $f" || echo "  FAIL: $f"
          done

      - name: Verify zh-CN key coverage vs en
        run: |
          echo "=== Key coverage check ==="
          MISMATCHES=0
          for ns in common settings chat onboarding home servers backends models hub mcp recipes checkpoints proxy about; do
            EN_COUNT=$(node -e "console.log(Object.keys(JSON.parse(require('fs').readFileSync('packages/app/src/i18n/locales/en/${ns}.json','utf8'))).length)")
            ZH_COUNT=$(node -e "console.log(Object.keys(JSON.parse(require('fs').readFileSync('packages/app/src/i18n/locales/zh-CN/${ns}.json','utf8'))).length)")
            if [ "$EN_COUNT" != "$ZH_COUNT" ]; then
              echo "  MISMATCH: $ns (en=$EN_COUNT, zh-CN=$ZH_COUNT)"
              MISMATCHES=$((MISMATCHES + 1))
            else
              echo "  OK: $ns ($EN_COUNT keys each)"
            fi
          done
          if [ $MISMATCHES -gt 0 ]; then
            echo "ERROR: $MISMATCHES namespace(s) have key count mismatches"
            exit 1
          fi
          echo "All 14 namespaces have matching key counts"

  desktop-package:
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    needs: build
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
            pkg-target: node24-linux-x64
            tauri-bundles: deb
            artifact-name: warpdrv-linux-deb
            artifact-path: packages/desktop/target/release/bundle/deb/*.deb
            ext: ""
          - os: windows-latest
            target: windows
            pkg-target: node24-win-x64
            tauri-bundles: msi
            artifact-name: warpdrv-windows-msi
            artifact-path: packages/desktop/target/release/bundle/msi/*.msi
            ext: .exe
          - os: macos-latest
            target: macos
            pkg-target: node24-macos-arm64
            tauri-bundles: dmg
            artifact-name: warpdrv-macos-dmg
            artifact-path: packages/desktop/target/release/bundle/dmg/*.dmg
            ext: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/desktop/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Linux system deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev patchelf build-essential curl wget file \
            libxdo-dev libxkbcommon-dev

      - name: Install npm dependencies
        run: npm install

      - name: Build frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npx vite build
        working-directory: packages/app

      - name: Build server binary (Linux/macOS)
        if: matrix.target != 'windows'
        run: |
          npx esbuild src/index.ts \
            --bundle --outfile=dist/server.cjs --format=cjs \
            --platform=node --target=node22 --minify=false \
            --external:kokoro-js --external:@huggingface/transformers \
            --external:onnxruntime-node
          cp ../../node_modules/better-sqlite3/build/Release/better_sqlite3.node dist/
          npx @yao-pkg/pkg dist/server.cjs \
            --target ${{ matrix.pkg-target }} \
            --output "dist/warpcore-server" --compress GZip
          mkdir -p dist/node_modules
          for pkg in kokoro-js @huggingface/transformers onnxruntime-node sharp; do
            cp -r "../../node_modules/$pkg" "dist/node_modules/$pkg" 2>/dev/null || echo "  skip $pkg"
          done
        working-directory: packages/server

      - name: Build server binary (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          npx esbuild src/index.ts --bundle --outfile=dist/server.cjs --format=cjs --platform=node --target=node22 --minify=false --external:kokoro-js --external:@huggingface/transformers --external:onnxruntime-node
          Copy-Item ..\..\node_modules\better-sqlite3\build\Release\better_sqlite3.node dist\
          npx @yao-pkg/pkg dist/server.cjs --target ${{ matrix.pkg-target }} --output "dist/warpcore-server.exe" --compress GZip
        working-directory: packages/server

      - name: Prepare sidecar (Linux/macOS)
        if: matrix.target != 'windows'
        run: |
          TARGET=$(rustc --print host-tuple)
          mkdir -p binaries/node_modules
          cp ../server/dist/warpcore-server "binaries/warpcore-server-$TARGET"
          cp ../server/dist/better_sqlite3.node binaries/
          cp -r ../server/dist/node_modules/. binaries/node_modules/ 2>/dev/null || true
          chmod +x "binaries/warpcore-server-$TARGET"
          rm -rf app-dist
          cp -r ../app/dist app-dist
        working-directory: packages/desktop

      - name: Prepare sidecar (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $TARGET = rustc --print host-tuple
          New-Item -ItemType Directory -Force -Path binaries
          Copy-Item ..\server\dist\warpcore-server.exe "binaries\warpcore-server-$TARGET.exe"
          Copy-Item ..\server\dist\better_sqlite3.node binaries\
          Remove-Item -Recurse -Force app-dist -ErrorAction SilentlyContinue
          Copy-Item -Recurse ..\app\dist app-dist
        working-directory: packages/desktop

      - name: Build Tauri
        run: npx tauri build --bundles ${{ matrix.tauri-bundles }}
        working-directory: packages/desktop

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          retention-days: 7
